[workspace]
members = [
    "crates/avalanche-model",
    "crates/avalanche-core",
    "crates/avalanche-index",
    "crates/avalanche-nix",
    "crates/avalanche-source",
    "crates/avalanche-ownership",
    "crates/avalanche-graph",
    "crates/avalanche-write",
    "crates/avalanche-validate",
    "crates/avalanche-git",
    "crates/avalanche-doctor",
    "crates/avalanche-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/avalanche"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
